<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="payroll.css">
    </head>
<body>
    <div id="maindiv">
           <div id ="headerdiv">
           <h2 id="pageheader">Simple Payroll</h2>     
        </div>
        <div id="inputdiv">
           <label class="inputlabel" for="employee1">Employee Name:</label>
           <input id="employee1" class="alignright" type="string" ></input><br>

           <label class="inputlabel" for="days1">Days Worked:</label>
           <input id="days1" class="alignright" type="number" ></input><br>

           <label class="inputlabel" for="rate1">Daily Rate:</label>
           <input id="rate1" type="number"></input><br>

           <label class="inputlabel" for="amount1">Deduction Amount:</label>
           <input id="amount1" type="number"></input><br>

           <br><br>
           <a href="index.html">Back to Home</a>
        </div>
        <div id="buttonsdiv">
            <button id="btnaddtocart">Add Item</button>
            <br><br>
            <button id="btnclearcart">Clear Cart</button> 
        </div>
        <div id="cartdiv">
           <h3>Cart Items</h3>
           <table id="itemstable" border=1>
               <thead>
                   <tr>
                       <td>Item No.</td>
                       <td id="itemdesc">Item Description</td>
                       <td>Quantity</td>
                       <td id="pricecolumn">Price</td>
                       <td id="amountcolumn">Amount</td>
                   </tr>
               </thead>
               <tbody id="tablebody">
               </tbody>
               <tfoot>
                   <tr>
                       <td></td>
                       <td></td>
                       <td></td>
                       <td>Total</td>
                       <td id="totalamount"></td>
                   </tr>
               </tfoot>
     
           </table>
           <br><br>
               <label class="inputline" for="items">Cart Items:</label>
               <input id="items"  type="number" readonly></input>
               
               <label class="inputline" for="delitem">Delete Item:</label>
               <input id="delitem" type="number"></input>
               <button id="btndelete">Delete</button>
               
        </div>
     </div>
     
     <!-- Simple pop-up dialog box, containing a form THIS IS NOT DISPLAYED BY DEFAULT -->
     <!--  this is only displayed by dlgConfirmCancel.showModal() -->
     <!-- The value assigned to the button is retrieved by e.target.returnvalue -->
     <dialog id="dlgConfirmCancel">
         <form method="dialog">
            <h4 id="dlgmsg"></h4>   
            <button id="btnConfirm" value="confirm" >Confirm</button>
            <button id="btnCancel" value="cancel" >Cancel</button>
            
         </form>
     </dialog>
     
     <dialog id="dlgAreYouSure">
         <form method="dialog">
            <h4 id="dlgmsg2">Are you sure?</h4>   
            <button id="btnYes" value="yes" >Yes</button>
            <button id="btnNo" value="no" >No</button>
            
         </form>
     </dialog>
</body>
<script src="payroll.js"></script>
</html>
